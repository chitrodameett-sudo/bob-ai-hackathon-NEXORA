submission:
  title: "NEXORA - AI-Powered Defense & Aerospace Equipment Readiness Monitoring"

  problem_statement: >
    Military organizations need to know whether aircraft, vehicles, and other
    equipment are truly mission-ready. Fixed maintenance schedules and
    fragmented equipment data can cause unexpected failures, delayed
    maintenance, and reduced operational readiness.

  solution_summary: >
    NEXORA is an AI-powered predictive maintenance and mission-readiness
    platform that analyzes equipment health, maintenance status, critical
    parts, supplier risk, and capacity to calculate real-time readiness.
    Its 3D Digital Twin identifies problem locations and helps maintenance
    teams prioritize critical equipment before failures occur.

  key_features:
    - "AI-powered predictive maintenance and equipment health analysis"
    - "Real-time mission readiness scoring"
    - "3D Digital Twin for identifying equipment problem locations"
    - "Smart maintenance prioritization for critical equipment"
    - "NEXORA AI Assistant for readiness explanations and recommendations"

  tech_stack:
    languages:
      - "JavaScript"
      - "HTML"
      - "CSS"
    frameworks:
      - "React 18"
      - "Vite"
      - "Node.js"
      - "Express.js"
    ibm_technologies:
      - "IBM watsonx.ai (planned integration)"
    databases:
      - "MongoDB"
      - "Mongoose"
      - "In-Memory Synthetic Data"
    other:
      - "Three.js"
      - "React Three Fiber"
      - "Tailwind CSS"
      - "Recharts"
      - "React Router"
      - "Lucide Icons"
      - "GitHub"

  what_we_are_most_proud_of: >
    We are most proud of combining predictive maintenance insights with a
    3D Digital Twin and an AI assistant in one platform. NEXORA does not
    only show that equipment is unhealthy; it helps explain why it is not
    ready and which equipment should receive maintenance first.

  known_limitations: >
    The current hackathon prototype uses synthetic data and an AI abstraction
    layer. Direct IBM watsonx.ai integration and production-scale real-world
    defense data integration are planned for future development.

